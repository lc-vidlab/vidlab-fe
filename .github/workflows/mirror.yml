# main을 이주혁 개인 저장소로 복제한다. Vercel(무료)은 그 개인 저장소를 배포한다.
# 조직의 비공개 저장소는 Vercel Hobby로 배포할 수 없어서다.
# 결정 근거: https://github.com/lc-vidlab/vidlab-fe/issues/33
#
# 설정 (Settings → Secrets and variables → Actions)
# - 변수 MIRROR_REPO: 개인 저장소 "계정/저장소" (예: my-account/vidlab)
# - 비밀값 MIRROR_TOKEN: 그 저장소에만 Contents · Workflows 쓰기 권한이 있는 fine-grained 토큰
#   (복제하는 코드에 .github/workflows가 있어서 Workflows 권한이 없으면 push가 거부된다)
# 둘 중 하나라도 없으면 아무것도 하지 않는다.
name: Mirror main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    # 복제된 개인 저장소 안에서는 돌지 않는다
    if: github.repository == 'lc-vidlab/vidlab-fe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # 기록 전체가 있어야 다른 저장소로 push할 수 있다
          fetch-depth: 0
          persist-credentials: false

      - name: 개인 저장소 main으로 push
        env:
          MIRROR_REPO: ${{ vars.MIRROR_REPO }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_REPO" ] || [ -z "$MIRROR_TOKEN" ]; then
            echo "::notice::MIRROR_REPO 또는 MIRROR_TOKEN이 없어 복제를 건너뜁니다."
            exit 0
          fi
          # Vercel 무료 플랜은 커밋 작성자가 저장소 주인일 때만 배포한다. 안 맞으면 미리 알려 준다
          echo "복제할 커밋: $(git log -1 --format='%h %an · %s')"
          git push --force "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git" HEAD:refs/heads/main
